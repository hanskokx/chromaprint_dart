name: chromaprint_dart
description: >-
  A pure-Dart port of Chromaprint's default fingerprint (algorithm 2), the
  audio fingerprint AcoustID looks up. No native code or external program.
version: 1.0.0+1
repository: https://github.com/hanskokx/chromaprint_dart
issue_tracker: https://github.com/hanskokx/chromaprint_dart/issues

topics:
  - audio
  - fingerprinting
  - acoustid
  - chromaprint

environment:
  sdk: ^3.12.2

dev_dependencies:
  arcane_analysis: ^1.0.5
  test: ^1.31.1
